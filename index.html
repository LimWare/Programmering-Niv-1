        correct: 0,
        explanation: "Lektionen nämner Canva (enkelt med mallar), Miro (perfekt för grupparbete), draw.io/diagrams.net (gratis, vanligt bland utvecklare), Figma samt Office/Google Drive."
    },
    {
        category: "Flowchart",
        question: "I Övning 2 (Temperaturkontroll) kontrolleras villkoret 'Om temperatur > 0'. Vad ska ske på Ja-vägen respektive Nej-vägen enligt övningen?",
        options: [
            "Ja → Skriv ut 'Över fryspunkt' | Nej → Skriv ut 'Fryspunkt'",
            "Ja → Skriv ut 'Fryspunkt' | Nej → Skriv ut 'Över fryspunkt'",
            "Ja → Starta om programmet | Nej → Lås kontot",
            "Ja → Beräkna medelvärde | Nej → Avsluta utan utskrift"
        ],
        correct: 0,
        explanation: "Om temperaturen är större än 0 (Ja) skrivs 'Över fryspunkt' ut, annars (Nej) skrivs 'Fryspunkt' ut, följt av Slut."
    },
    {
        category: "Flowchart",
        question: "Titta på det utbyggda flödesschemat för Lösenordskontroll (Övning 3). Vad händer om lösenordet är FEL ('No' vid 'Är det Rätt?')?",
        options: [
            "Det visas ett felmeddelande ('Inloggning misslyckades') och därefter kontrolleras 'Finns det försök kvar?' i en ny romb",
            "Programmet går direkt till 'Slut' utan att visa något meddelande",
            "Användaren loggas in på ett gästkonto automatiskt",
            "Kontot låses direkt vid allra första felaktiga försöket"
        ],
        correct: 0,
        explanation: "Vid fel lösenord visas först 'Inloggning misslyckades', sedan kollar en beslutssymbol om det finns försök kvar: vid 'Yes' går pilen tillbaka till 'Ange lösenord', vid 'No' sker kontolåsning."
    },
    {
        category: "Flowchart",
        question: "I Övning 4 (Betygssättning A–F samt validering av ogiltig inmatning), vilken kontroll måste ligga ALLRA FÖRST efter 'Mata in poäng' och i vilken ordning testas betygen?",
        options: [
            "Först kontrolleras om poängen är ogiltig ('Poäng < 0 eller > 100?'), och därefter testas betygen uppifrån och ner med start på högsta betyg (≥ 90 för A, ≥ 80 för B osv.)",
            "Först testas lägsta betyg (≥ 50 för E) och allra sist kontrolleras om poängen är över 100",
            "Ordningen spelar ingen roll i ett flödesschema så länge alla romber finns med",
            "Man kontrollerar bara betyg C och låter användaren gissa resten"
        ],
        correct: 0,
        explanation: "Flödesschemat går uppifrån och ner. Först fångar man upp ogiltig inmatning (< 0 eller > 100), och sedan kollar man från högsta gränsen (≥ 90 → A, Nej → ≥ 80 → B osv.) så att t.ex. 85 poäng ger B."

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentFilter = 'Alla';

function startQuiz(category) {
    currentFilter = category;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.startsWith(category));
    });
    if (category === 'Alla') {
        currentQuestions = [...allQuestions];
    } else {
        currentQuestions = allQuestions.filter(q => q.category === category);
    }
    currentIndex = 0;
    score = 0;
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    const total = currentQuestions.length;
    document.getElementById('question-counter').textContent = `Fråga ${currentIndex + 1} av ${total}`;
    document.getElementById('category-badge').textContent = q.category;
    document.getElementById('progress-fill').style.width = `${((currentIndex) / total) * 100}%`;
    document.getElementById('question-text').textContent = q.question;

    const optionsList = document.getElementById('options-list');
    optionsList.innerHTML = '';

    // Create shuffled index mapping so correct answer isn't always first
    let indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    indices.forEach(optIndex => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = q.options[optIndex];
        btn.onclick = () => selectOption(btn, optIndex === q.correct, q.explanation);
        btn.dataset.correct = (optIndex === q.correct);
        optionsList.appendChild(btn);
    });

    document.getElementById('feedback-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function selectOption(selectedBtn, isCorrect, explanation) {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.correct === "true") {
            btn.classList.add('correct');
        }
    });

    const feedbackBox = document.getElementById('feedback-box');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    if (isCorrect) {
        score++;
        selectedBtn.classList.add('correct');
        feedbackTitle.textContent = "Rätt svar! 🎉";
        feedbackTitle.style.color = "var(--correct)";
    } else {
        selectedBtn.classList.add('wrong');
        feedbackTitle.textContent = "Fel svar";
        feedbackTitle.style.color = "var(--wrong)";
    }

    feedbackText.textContent = explanation;
    feedbackBox.style.display = 'block';
    document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-card').style.display = 'none';
    const resultScreen = document.getElementById('result-screen');
    resultScreen.style.display = 'block';
    const total = currentQuestions.length;
    document.getElementById('final-score').textContent = `${score} / ${total}`;
    const pct = Math.round((score / total) * 100);
    let msg = `Du fick ${pct}% rätt! `;
    if (pct === 100) msg += "Spikat! Du har stenkoll på både Git, branches, push/pull och flowcharts.";
    else if (pct >= 80) msg += "Riktigt bra jobbat! Du är väl förberedd inför lektionen och övningarna.";
    else msg += "Bra kämpat! Kör gärna igenom en vända till för att sätta alla begrepp.";
    document.getElementById('result-message').textContent = msg;
}

startQuiz('Alla');
</script>
