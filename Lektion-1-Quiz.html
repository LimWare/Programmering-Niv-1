<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – Programmering 1 (Lektion 1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">Programmering 1 • Lektion 1 Quiz</h1>
      </div>
      <div id="stat-pill" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        Fråga <span id="current-index" class="text-cyan-400">1</span> / <span id="total-count">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl shadow-cyan-950/20 relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
        <div id="progress" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-300 ease-out"></div>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen">
        <div class="flex items-center justify-between mb-4">
          <span id="question-category" class="text-xs font-semibold uppercase tracking-wider text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-2.5 py-1 rounded-md">Begrepp</span>
          <span id="score-counter" class="text-xs font-medium text-slate-400">Poäng: <strong id="score" class="text-slate-200">0</strong></span>
        </div>

        <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-white mb-6 leading-relaxed">
          Frågan laddas...
        </h2>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3 mb-6"></div>

        <!-- Explanation Card -->
        <div id="explanation-box" class="hidden rounded-2xl p-4 sm:p-5 border transition-all duration-200 mb-6">
          <div class="flex items-start gap-3">
            <span id="explanation-icon" class="text-xl leading-none mt-0.5">💡</span>
            <div>
              <p id="explanation-title" class="font-bold text-sm mb-1"></p>
              <p id="explanation-text" class="text-sm leading-relaxed text-slate-300"></p>
            </div>
          </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn" class="hidden w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25 active:scale-[0.99] flex items-center justify-center gap-2">
          <span>Nästa fråga</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden text-center py-4">
        <div id="result-badge" class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-4xl mb-6">
          🏆
        </div>
        <h2 class="text-3xl font-extrabold text-white mb-2">Quizet är klart!</h2>
        <p class="text-slate-400 mb-6 text-sm">Bra jobbat med genomgången av Lektion 1!</p>

        <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-score">0</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Antal rätt</span>
          </div>
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-percentage">0%</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Träffsäkerhet</span>
          </div>
        </div>

        <p id="grade-comment" class="text-base text-slate-200 font-semibold mb-8 max-w-md mx-auto"></p>

        <button id="restart-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25">
          Starta om quizet
        </button>
      </div>

    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
    JENSEN education • Programmering 1 • Kursmaterial & Quiz
  </footer>

  <script>
    const quizData = [
      {
        category: "Grundbegrepp",
        question: "Vad är den primära skillnaden mellan maskinkod och källkod skriven i ett programmeringsspråk?",
        options: [
          "Maskinkod består av instruktioner i ren text, medan källkod är krypterad",
          "Källkod kan exekveras direkt av processorn, medan maskinkod måste tolkas via webbläsaren",
          "Maskinkod består uteslutande av binära bitar (0 och 1) som CPU:n kör, medan källkod är skriven för människor och måste översättas",
          "Maskinkod används enbart vid nätverksöverföring, medan källkod styr datorns arbetsminne"
        ],
        answer: 2,
        explanation: "Datorns hårdvara (CPU) förstår enbart maskinkod (ettor och nollor). All källkod måste översättas dit."
      },
      {
        category: "Dataenheter",
        question: "Hur många bitar (b) krävs det för att lagra 4 Bytes (B)?",
        options: [
          "16 bitar",
          "32 bitar",
          "64 bitar",
          "4 096 bitar"
        ],
        answer: 1,
        explanation: "Eftersom 1 Byte = 8 bitar, ger 4 Bytes: 4 * 8 = 32 bitar."
      },
      {
        category: "Dataenheter",
        question: "Varför motsvarar 1 Megabyte (MB) exakt 1 024 Kilobytes (KB) och inte 1 000 KB inom datavetenskap?",
        options: [
          "Det är baserat på standardiserade ISO-regler för nätverkshastigheter",
          "Datorns minnesadresser är uppbyggda kring det binära talsystemet (2¹⁰ = 1 024)",
          "1 024 är den maximala mängd data som ryms i processorns L1-cache",
          "Det beror på en felberäkning i tidiga IBM-datorer som behållits som standard"
        ],
        answer: 1,
        explanation: "Datorer räknar i potenser av 2. 2 upphöjt till 10 är precis 1 024, vilket utgör basen för KB, MB och GB."
      },
      {
        category: "Assemblerspråk",
        question: "Vad kallas de symboliska textinstruktionerna som LOAD, ADD och MOV i assemblerspråk?",
        options: [
          "Direktiv",
          "Mnemoniska symboler",
          "Bytekoder",
          "Pseudokoder"
        ],
        answer: 1,
        explanation: "De korta textorden kallas mnemoniska symboler (mnemonics) för att de ska vara lätta att komma ihåg för människor."
      },
      {
        category: "Assemblerspråk",
        question: "Vilket program ansvarar för att översätta assembleringsspråk till maskinkod?",
        options: [
          "En kommandotolk",
          "En länkare (linker)",
          "En assemblator (assembler)",
          "En interpretator"
        ],
        answer: 2,
        explanation: "Det specifika översättningsprogrammet för assembler kallas en assemblator (på engelska assembler)."
      },
      {
        category: "Datorhistoria",
        question: "Hur matades instruktioner in i tidiga datorer som ENIAC (1946) innan assembleringsspråk uppfanns?",
        options: [
          "Genom manuell koppling av kablar och mekaniska strömbrytare på maskinen",
          "Genom magnetband som lästes in med optiska sensorer",
          "Genom att kompilera enkla textkommandon via hålkort",
          "Genom ett förinstallerat BIOS på disketter"
        ],
        answer: 0,
        explanation: "På ENIAC fanns inga lagrade program; programmerarna ändrade datorns logik fysiskt med sladdar och brytare."
      },
      {
        category: "Högnivåspråk",
        question: "Vad kännetecknar ett 'högnivåspråk' jämfört med ett lågnivåspråk?",
        options: [
          "Det körs snabbare i hårdvaran eftersom det inte kräver översättning",
          "Det är abstraherat från maskinens hårdvaruarkitektur och liknar mänskligt språk",
          "Det tillåter endast numeriska beräkningar och saknar stöd för textsträngar",
          "Det kräver att utvecklaren manuellt anger minnesregister för varje variabel"
        ],
        answer: 1,
        explanation: "Högnivåspråk (t.ex. Python) abstraherar bort register och CPU-specifika detaljer till förmån för mänsklig läsbarhet."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Vilket påstående beskriver bäst hur en kompilator fungerar?",
        options: [
          "Den översätter och exekverar koden rad för rad direkt i datorns arbetsminne",
          "Den analyserar hela källkoden i förväg och skapar en fristående körbar fil (.exe)",
          "Den körs uteslutande inuti webbläsaren för att visa dynamisk HTML",
          "Den rättar logiska buggar automatiskt under programkörning"
        ],
        answer: 1,
        explanation: "En kompilator gör en total översättning av källkoden till maskinkod i förväg och genererar en körbar fil."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Vad händer när ett program som körs med en interpretator har ett syntaxfel på rad 15?",
        options: [
          "Programmet vägrar starta och felmeddelandet visas omedelbart innan rad 1 körs",
          "Interpretatorn hoppar över rad 15 och slutför resten av skriptet",
          "Rad 1 till 14 utförs felfritt, men programmet avbryts tvärt när det når rad 15",
          "Hela källkodsfilen raderas ur projektmappen"
        ],
        answer: 2,
        explanation: "Eftersom interpretatorn tolkar rad för rad i stunden körs all kod fram till den rad där felet uppstår, där den kraschar."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Varför tenderar ett kompilerat program i C eller C++ att köra snabbare än samma program i Python?",
        options: [
          "C++ använder alltid mindre minne på hårddisken än Python",
          "C++ källkod hoppar över CPU-klockcykler",
          "Det kompilerade programmet finns redan i direkt exekverbar maskinkod utan tolk i realtid",
          "Interpretatorer tillåter inte matematiska beräkningar i processorns flyttalsenhet"
        ],
        answer: 2,
        explanation: "Kompilerad kod körs direkt av processorn utan en tolk som måste läsa, analysera och exekvera rad för rad under drift."
      },
      {
        category: "Språkklassificering",
        question: "Vilket av följande språk är primärt kompilerat till maskinkod i stället för tolkat?",
        options: [
          "Python",
          "JavaScript",
          "C++",
          "Ruby"
        ],
        answer: 2,
        explanation: "C++ kompileras direkt till maskinkod i förväg, medan Python, JavaScript och Ruby tolkas vid körning."
      },
      {
        category: "Felsökning",
        question: "Vad är skillnaden mellan ett 'syntaxfel' och en 'logisk bugg' vid debugging?",
        options: [
          "Syntaxfel kraschar kompilatorn/tolken för att kodreglerna bröts; logiska fel gör att koden körs men ger fel resultat",
          "Syntaxfel beror alltid på felaktig hårdvara; logiska buggar beror på fel i operativsystemet",
          "Syntaxfel uppstår bara i Python; logiska fel uppstår bara i kompilerade språk",
          "Det finns ingen skillnad, båda termerna avser exakt samma typ av felmeddelande"
        ],
        answer: 0,
        explanation: "Ett syntaxfel bryter mot grammatiken så koden inte kan tolkas. Ett logiskt fel gör fel beräkningar fast koden är 'korrekt' skriven."
      },
      {
        category: "Python fakta",
        question: "Vilket år lanserades Python officiellt av Guido van Rossum?",
        options: [
          "1985",
          "1991",
          "1996",
          "2001"
        ],
        answer: 1,
        explanation: "Python skapades i slutet av 1980-talet och släpptes officiellt första gången år 1991."
      },
      {
        category: "Kurslitteratur",
        question: "Vem är författaren till kursboken 'Python från början' som används i kursen?",
        options: [
          "Bjarne Stroustrup",
          "Jan Skansholm",
          "Guido van Rossum",
          "Pierre Gergi"
        ],
        answer: 1,
        explanation: "Läroboken 'Python från början' är skriven av Jan Skansholm (Studentlitteratur)."
      },
      {
        category: "Installation & Miljö",
        question: "Vad stämmer angående Python-installation på Mac och Linux enligt genomgången?",
        options: [
          "Python kan inte installeras på dessa system utan emulator",
          "Systemen har ofta en Python-interpretator förinstallerad från start",
          "Man måste alltid kompilera Python från källkod manuellt",
          "De kräver alltid betallicens för att köra Python-skript"
        ],
        answer: 1,
        explanation: "Mac och Linux har historiskt och praktiskt oftast en Python-miljö färdiginstallerad i operativsystemet."
      },
      {
        category: "Webbverktyg",
        question: "Vilken funktion fyller online-verktyget OneCompiler?",
        options: [
          "Det formaterar om Python-filer till PDF-rapporter",
          "Det är en webbtjänst för att skriva, köra och dela kod i över 60 språk direkt i webbläsaren",
          "Det är ett installationsprogram som ersätter Visual Studio Code",
          "Det kontrollerar om datorn har virus innan Python installeras"
        ],
        answer: 1,
        explanation: "OneCompiler låter användare köra källkod i över 60 olika språk direkt i molnet utan att installera något lokalt."
      },
      {
        category: "VS Code Setup",
        question: "Varför behöver man installera det officiella 'Python Extension' i VS Code?",
        options: [
          "För att VS Code i grunden bara är en generell textredigerare utan inbyggt språkstöd för att köra och felsöka Python",
          "För att aktivera licensen för Windows",
          "För att datorn ska kunna ansluta till internet",
          "För att kunna använda vanliga tangenter som enter och backsteg"
        ],
        answer: 0,
        explanation: "VS Code är en modulär editor; Python-tillägget lägger till syntaxfärgning, körknapp, linting och felsökare för just Python."
      },
      {
        category: "VS Code Genvägar",
        question: "Vad är skillnaden i funktion mellan kortkommandot Ctrl + P och Ctrl + Shift + P i VS Code?",
        options: [
          "Ctrl + P skriver ut dokumentet på skrivare; Ctrl + Shift + P sparar projektet",
          "Ctrl + P söker snabbt fram filer; Ctrl + Shift + P öppnar kommandopaletten för editorfunktioner",
          "Ctrl + P startar programmet; Ctrl + Shift + P pausar debuggern",
          "Båda kommandona gör exakt samma sak"
        ],
        answer: 1,
        explanation: "Ctrl + P är 'Quick Open' för filnamn. Lägger man till Shift öppnas Command Palette där man kan söka efter kommandon."
      },
      {
        category: "VS Code Genvägar",
        question: "Vilket kortkommando används för att flytta en hel kodrad uppåt eller nedåt i VS Code?",
        options: [
          "Ctrl + Arrow Up / Down",
          "Alt + Arrow Up / Down",
          "Shift + Arrow Up / Down",
          "Ctrl + Shift + Arrow Up / Down"
        ],
        answer: 1,
        explanation: "Alt + Pil upp/ner flyttar raden. (Ctrl + Shift + Pil kopierar raden uppåt/nedåt i stället)."
      },
      {
        category: "VS Code Genvägar",
        question: "Vilket kortkommando öppnar snabbfix-menyn (Quick Fix) för att snabbt korrigera ett markerat kodproblem?",
        options: [
          "Ctrl + . (punkt)",
          "Ctrl + , (komma)",
          "Ctrl + Space",
          "F12"
        ],
        answer: 0,
        explanation: "Ctrl + . (punkt) öppnar Quick Fix med förslag på lösningar. (Ctrl + komma öppnar inställningarna; Ctrl + Space öppnar autokomplettering)."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationTitle = document.getElementById("explanation-title");
    const explanationText = document.getElementById("explanation-text");
    const explanationIcon = document.getElementById("explanation-icon");
    const nextBtn = document.getElementById("next-btn");
    const currentIndexEl = document.getElementById("current-index");
    const totalCountEl = document.getElementById("total-count");
    const progressBar = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const categoryEl = document.getElementById("question-category");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const finalScore = document.getElementById("final-score");
    const finalPercentage = document.getElementById("final-percentage");
    const gradeComment = document.getElementById("grade-comment");
    const restartBtn = document.getElementById("restart-btn");

    function initQuiz() {
      totalCountEl.textContent = quizData.length;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const data = quizData[currentQuestion];

      currentIndexEl.textContent = currentQuestion + 1;
      categoryEl.textContent = data.category;
      questionText.textContent = data.question;
      explanationBox.classList.add("hidden");
      nextBtn.classList.add("hidden");

      const progressPercent = ((currentQuestion) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      optionsContainer.innerHTML = "";

      data.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-850 hover:border-slate-600 hover:bg-slate-800 transition-all duration-150 flex items-center justify-between group";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300 group-hover:border-cyan-500/50">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span class="text-sm sm:text-base font-medium text-slate-200">${opt}</span>
          </div>
        `;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (answered) return;
      answered = true;

      const data = quizData[currentQuestion];
      const buttons = optionsContainer.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);

      if (selectedIndex === data.answer) {
        score++;
        scoreEl.textContent = score;
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-emerald-500", "bg-emerald-950/40", "text-emerald-200");

        explanationBox.className = "rounded-2xl p-5 border border-emerald-800/60 bg-emerald-950/20 mb-6";
        explanationIcon.textContent = "✅";
        explanationTitle.className = "font-bold text-sm text-emerald-400 mb-1";
        explanationTitle.textContent = "Helt rätt!";
      } else {
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-rose-500", "bg-rose-950/40", "text-rose-200");

        const correctBtn = buttons[data.answer];
        correctBtn.classList.remove("border-slate-800", "bg-slate-850");
        correctBtn.classList.add("border-emerald-500/80", "bg-emerald-950/20", "text-emerald-300");

        explanationBox.className = "rounded-2xl p-5 border border-rose-800/60 bg-rose-950/20 mb-6";
        explanationIcon.textContent = "❌";
        explanationTitle.className = "font-bold text-sm text-rose-400 mb-1";
        explanationTitle.textContent = "Inte riktigt.";
      }

      explanationText.textContent = data.explanation;
      explanationBox.classList.remove("hidden");
      nextBtn.classList.remove("hidden");

      if (currentQuestion === quizData.length - 1) {
        nextBtn.querySelector("span").textContent = "Se slutresultat";
      }
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      progressBar.style.width = "100%";

      finalScore.textContent = `${score} / ${quizData.length}`;
      const pct = Math.round((score / quizData.length) * 100);
      finalPercentage.textContent = `${pct}%`;

      if (pct >= 90) {
        gradeComment.textContent = "Toppbetyg! Du kan lektion 1 utan och innan, från teori till VS Code-kommandon.";
      } else if (pct >= 70) {
        gradeComment.textContent = "Mycket bra jobbat! Du har koll på det allra mesta inför nästa lektion.";
      } else if (pct >= 50) {
        gradeComment.textContent = "Godkänt! Repetera gärna kortkommandona och minnesenheterna en gång till.";
      } else {
        gradeComment.textContent = "Kika igenom presentationsbilderna en gång till och gör ett nytt försök!";
      }
    }

    restartBtn.onclick = () => {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = "0";
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      nextBtn.querySelector("span").textContent = "Nästa fråga";
      showQuestion();
    };

    initQuiz();
  </script>
</body>
</html>
