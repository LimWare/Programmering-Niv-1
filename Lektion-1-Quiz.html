<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – Programmering Nivå 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">Programmering Nivå 1</h1>
      </div>
      <div id="stat-pill" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        Fråga <span id="current-index" class="text-cyan-400">1</span> / <span id="total-count">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl shadow-cyan-950/20 relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
        <div id="progress" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-300 ease-out"></div>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen">
        <div class="flex items-center justify-between mb-4">
          <span id="question-category" class="text-xs font-semibold uppercase tracking-wider text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-2.5 py-1 rounded-md">Begrepp</span>
          <span id="score-counter" class="text-xs font-medium text-slate-400">Poäng: <strong id="score" class="text-slate-200">0</strong></span>
        </div>

        <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-white mb-6 leading-relaxed">
          Frågan laddas...
        </h2>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3 mb-6"></div>

        <!-- Explanation Card -->
        <div id="explanation-box" class="hidden rounded-2xl p-4 sm:p-5 border transition-all duration-200 mb-6">
          <div class="flex items-start gap-3">
            <span id="explanation-icon" class="text-xl leading-none mt-0.5">💡</span>
            <div>
              <p id="explanation-title" class="font-bold text-sm mb-1"></p>
              <p id="explanation-text" class="text-sm leading-relaxed text-slate-300"></p>
            </div>
          </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn" class="hidden w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25 active:scale-[0.99] flex items-center justify-center gap-2">
          <span>Nästa fråga</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden text-center py-4">
        <div id="result-badge" class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-4xl mb-6">
          🏆
        </div>
        <h2 class="text-3xl font-extrabold text-white mb-2">Quizet är klart!</h2>
        <p class="text-slate-400 mb-6 text-sm">Här är en sammanställning av dina kunskaper i Programmering nivå 1.</p>

        <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-score">0</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Antal rätt</span>
          </div>
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-percentage">0%</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Träffsäkerhet</span>
          </div>
        </div>

        <p id="grade-comment" class="text-base text-slate-200 font-semibold mb-8 max-w-md mx-auto"></p>

        <button id="restart-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25">
          Starta om quizet
        </button>
      </div>

    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
    Programmering Nivå 1 • Självstudier & Quiz
  </footer>

  <script>
    const quizData = [
      {
        category: "Grundbegrepp",
        question: "Vad är ett programspråk i grunden?",
        options: [
          "Ett operativsystem som styr datorns processor och minne",
          "Ett formellt språk som människor använder för att ge instruktioner och skapa mjukvara till en dator",
          "En datorkomponent som översätter hårdvara till grafik",
          "En typ av textfil som bara kan köras inuti en webbläsare"
        ],
        answer: 1,
        explanation: "Ett programspråk är ett formellt, strukturerat språk för instruktioner till en dator. Det översätts sedan till maskinkod (ettor och nollor)."
      },
      {
        category: "Dataenheter",
        question: "Hur många bitar (b) ingår det i 1 Byte (B)?",
        options: [
          "4 bitar",
          "8 bitar",
          "16 bitar",
          "1 024 bitar"
        ],
        answer: 1,
        explanation: "1 Byte består exakt av 8 bitar. Minsta värdet är en bit (0 eller 1)."
      },
      {
        category: "Dataenheter",
        question: "Hur många Kilobytes (KB) motsvarar 1 Megabyte (MB)?",
        options: [
          "100 KB",
          "1 000 KB",
          "1 024 KB",
          "1 048 576 KB"
        ],
        answer: 2,
        explanation: "I datavärlden används tvåpotenser där 1 MB = 1 024 KB, och 1 KB = 1 024 Bytes."
      },
      {
        category: "Maskinkod & CPU",
        question: "Vilken är den enda form av kod som en dators processor (CPU) faktiskt kan avkoda och köra direkt?",
        options: [
          "Python-skript",
          "C++ källkod",
          "Maskinkod (binär form med ettor och nollor)",
          "Assembler-symboler"
        ],
        answer: 2,
        explanation: "En dator kan i grund och botten inte köra någonting annat än ren maskinkod (sekvenser av ettor och nollor)."
      },
      {
        category: "Assemblerspråk",
        question: "Vad kallas de läsbara textorden som används i assemblerspråk (som LOAD, ADD, MOV)?",
        options: [
          "Funktionsparametrar",
          "Mnemoniska symboler",
          "Syntaxregler",
          "Binära variabler"
        ],
        answer: 1,
        explanation: "Assembler använder mnemoniska (minnesvänliga) symboler som instruktioner istället för råa binära siffersekvenser."
      },
      {
        category: "Assemblerspråk",
        question: "Hur körs ett program skrivet i assemblerspråk?",
        options: [
          "Det tolkas rad för rad i webbläsaren",
          "Processorn förstår källkoden helt direkt utan översättning",
          "Det översätts till maskinkod av ett särskilt program som kallas assemblator",
          "Det packas om till ett Python-paket"
        ],
        answer: 2,
        explanation: "Ordningen är: Assemblerspråk ➔ Assemblator (assembler) ➔ Maskinkod."
      },
      {
        category: "Datorhistoria",
        question: "Hur programmerades den tidiga datorn ENIAC (1946) innan assembler fanns?",
        options: [
          "Med enkla textfiler på disketter",
          "Helt manuellt via fysiska strömbrytare, knappar och kablar",
          "Genom röstigenkänning och reläer",
          "Med hålkort skrivna i Python"
        ],
        answer: 1,
        explanation: "På ENIAC (som var ca 130 kvm stor) programmerade man manuellt med fysiska kopplingar, kablar och strömbrytare. Assembler uppfanns för att förenkla detta."
      },
      {
        category: "Högnivåspråk",
        question: "Vad kännetecknar ett högnivåspråk (som Python, Java eller C#)?",
        options: [
          "Det styrs endast av fysiska kretsar och strömbrytare",
          "Det är utformat för att vara lätt för människor att läsa och skriva och liknar engelska eller matematik",
          "Det körs alltid utan att behöva översättas till maskinkod",
          "Det kan bara användas för att bygga datorspel"
        ],
        answer: 1,
        explanation: "Högnivåspråk prioriterar läsbarhet för människor och ligger nära engelska språket och matematisk logik."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Hur arbetar en kompilator (Compiler)?",
        options: [
          "Den läser och kör källkoden rad för rad under drift",
          "Den läser igenom hela koden på en gång och skapar en fristående körbar binärfil (t.ex. en .exe-fil)",
          "Den söker enbart efter kommentarer i källkoden",
          "Den översätter koden till engelsk text för utvecklaren"
        ],
        answer: 1,
        explanation: "En kompilator analyserar hela koden i förväg, kontrollerar syntaxfel och bygger en färdig körbar fil (.exe)."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Hur beter sig en interpretator (Interpreter) när den stöter på ett fel i koden?",
        options: [
          "Den vägrar starta programmet tills alla fel i hela projektet är åtgärdade",
          "Den rättar automatiskt felet med hjälp av AI",
          "Den kör programmet fram till felaktiga raden och kraschar/stannar tvärt där",
          "Den ignorerar felet och hoppar över resten av programmet"
        ],
        answer: 2,
        explanation: "Eftersom interpretatorn tolkar i realtid rad för rad körs all felfri kod tills den träffar på felet, varpå programmet avbryts med ett felmeddelande."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Vilken typ av program körs i regel snabbast under själva driften?",
        options: [
          "Kompilerade program, eftersom processorn får färdig maskinkod direkt utan en tolk emellan",
          "Interpreterade program, eftersom de laddar en rad i taget i minnet",
          "Bash- och PowerShell-skript",
          "Program skrivna enbart i textredigerare"
        ],
        answer: 0,
        explanation: "Kompilerade program körs snabbare eftersom all översättning redan är gjord i förväg till maskinkod."
      },
      {
        category: "Språkexempel",
        question: "Vilka av följande språk är typiska exempel på tolkade (interpreterade) språk?",
        options: [
          "C och C++",
          "Python, JavaScript och Ruby",
          "Assembler och Maskinkod",
          "Go och Swift"
        ],
        answer: 1,
        explanation: "Python, JavaScript, Ruby samt kommandotolkar som Bash och PowerShell tolkas och körs via en interpretator."
      },
      {
        category: "Felsökning",
        question: "Vad innebär begreppet 'Syntax' inom programmering?",
        options: [
          "Datorns processorhastighet mätt i gigahertz",
          "Språkets strikta grammatik och skrivregler (t.ex. kolon, parenteser och stavning)",
          "Namnet på den fil som skapas vid kompilering",
          "Minnesåtgången för ett program"
        ],
        answer: 1,
        explanation: "Syntax är programmeringsspråkets regler. Missar man t.ex. ett kolon eller en parentes uppstår ett syntaxfel."
      },
      {
        category: "Felsökning",
        question: "Vad kallas processen att systematiskt leta upp, förstå och åtgärda fel i programkod?",
        options: [
          "Encoding",
          "Debugging (avlusning)",
          "Compilation",
          "Parsing"
        ],
        answer: 1,
        explanation: "Debugging (avlusning) innebär att leta efter fel och 'buggar' och rätta till dem så programmet fungerar rätt."
      },
      {
        category: "Python",
        question: "Vem skapade programspråket Python och vilket år lanserades det?",
        options: [
          "Dennis Ritchie, 1972",
          "Guido van Rossum, 1991",
          "Bjarne Stroustrup, 1985",
          "James Gosling, 1995"
        ],
        answer: 1,
        explanation: "Python skapades och lanserades av nederländaren Guido van Rossum år 1991."
      },
      {
        category: "Python",
        question: "Vilken filändelse har filer som innehåller Python-kod?",
        options: [
          ".exe",
          ".pt",
          ".py",
          ".script"
        ],
        answer: 2,
        explanation: "Python-filer sparas alltid med filändelsen .py (till exempel main.py)."
      },
      {
        category: "Verktyg (IDE)",
        question: "Vad står förkortningen IDE för?",
        options: [
          "Internal Data Engine",
          "Integrated Development Environment",
          "Instruction Decoding Element",
          "Internet Device Emulator"
        ],
        answer: 1,
        explanation: "IDE står för Integrated Development Environment (Integrerad utvecklingsmiljö)."
      },
      {
        category: "Verktyg (IDE)",
        question: "Vilka tre huvudsakliga verktyg brukar ingå i en komplett IDE (som t.ex. VS Code eller PyCharm)?",
        options: [
          "Webbläsare, e-postklient och antivirusprogram",
          "Textredigerare (med färgmarkering), kompilator/interpretator och debugger",
          "Kalkylprogram, presentationsverktyg och bildredigerare",
          "Operativsystem, BIOS och hårdvarudrivrutiner"
        ],
        answer: 1,
        explanation: "En IDE samlar kodredigerare med syntaxfärger, verktyg för att köra koden samt en debugger för att stega och granska variabler."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    // DOM-element
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationTitle = document.getElementById("explanation-title");
    const explanationText = document.getElementById("explanation-text");
    const explanationIcon = document.getElementById("explanation-icon");
    const nextBtn = document.getElementById("next-btn");
    const currentIndexEl = document.getElementById("current-index");
    const totalCountEl = document.getElementById("total-count");
    const progressBar = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const categoryEl = document.getElementById("question-category");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const finalScore = document.getElementById("final-score");
    const finalPercentage = document.getElementById("final-percentage");
    const gradeComment = document.getElementById("grade-comment");
    const restartBtn = document.getElementById("restart-btn");

    function initQuiz() {
      totalCountEl.textContent = quizData.length;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const data = quizData[currentQuestion];

      currentIndexEl.textContent = currentQuestion + 1;
      categoryEl.textContent = data.category;
      questionText.textContent = data.question;
      explanationBox.classList.add("hidden");
      nextBtn.classList.add("hidden");

      const progressPercent = ((currentQuestion) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      optionsContainer.innerHTML = "";

      data.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-850 hover:border-slate-600 hover:bg-slate-800 transition-all duration-150 flex items-center justify-between group";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300 group-hover:border-cyan-500/50">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span class="text-sm sm:text-base font-medium text-slate-200">${opt}</span>
          </div>
        `;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (answered) return;
      answered = true;

      const data = quizData[currentQuestion];
      const buttons = optionsContainer.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);

      if (selectedIndex === data.answer) {
        score++;
        scoreEl.textContent = score;
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-emerald-500", "bg-emerald-950/40", "text-emerald-200");

        explanationBox.className = "rounded-2xl p-5 border border-emerald-800/60 bg-emerald-950/20 mb-6";
        explanationIcon.textContent = "✅";
        explanationTitle.className = "font-bold text-sm text-emerald-400 mb-1";
        explanationTitle.textContent = "Helt rätt!";
      } else {
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-rose-500", "bg-rose-950/40", "text-rose-200");

        const correctBtn = buttons[data.answer];
        correctBtn.classList.remove("border-slate-800", "bg-slate-850");
        correctBtn.classList.add("border-emerald-500/80", "bg-emerald-950/20", "text-emerald-300");

        explanationBox.className = "rounded-2xl p-5 border border-rose-800/60 bg-rose-950/20 mb-6";
        explanationIcon.textContent = "❌";
        explanationTitle.className = "font-bold text-sm text-rose-400 mb-1";
        explanationTitle.textContent = "Inte riktigt.";
      }

      explanationText.textContent = data.explanation;
      explanationBox.classList.remove("hidden");
      nextBtn.classList.remove("hidden");

      if (currentQuestion === quizData.length - 1) {
        nextBtn.querySelector("span").textContent = "Se slutresultat";
      }
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      progressBar.style.width = "100%";

      finalScore.textContent = `${score} / ${quizData.length}`;
      const pct = Math.round((score / quizData.length) * 100);
      finalPercentage.textContent = `${pct}%`;

      if (pct >= 90) {
        gradeComment.textContent = "Strålande resultat! Du har stenkoll på grunderna i Programmering nivå 1.";
      } else if (pct >= 70) {
        gradeComment.textContent = "Bra jobbat! Du har koll på de viktigaste begreppen, med bara några få missar.";
      } else if (pct >= 50) {
        gradeComment.textContent = "Godkänt, men repetera gärna skillnaden mellan kompilator och interpretator samt assembler!";
      } else {
        gradeComment.textContent = "Ta en titt på lektionsanteckningarna en gång till och gör ett nytt försök!";
      }
    }

    restartBtn.onclick = () => {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = "0";
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      nextBtn.querySelector("span").textContent = "Nästa fråga";
      showQuestion();
    };

    initQuiz();
  </script>
</body>
</html>
