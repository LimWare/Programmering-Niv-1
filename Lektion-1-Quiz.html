<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – Programmering 1 (Lektion 1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, .mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">Programmering 1 • Lektion 1 Quiz</h1>
      </div>
      <div id="stat-pill" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        Fråga <span id="current-index" class="text-cyan-400">1</span> / <span id="total-count">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl shadow-cyan-950/20 relative overflow-hidden">
      
      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full mb-8 overflow-hidden">
        <div id="progress" class="bg-gradient-to-r from-cyan-500 to-blue-500 h-full w-0 transition-all duration-300 ease-out"></div>
      </div>

      <!-- Quiz Screen -->
      <div id="quiz-screen">
        <div class="flex items-center justify-between mb-4">
          <span id="question-category" class="text-xs font-semibold uppercase tracking-wider text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 px-2.5 py-1 rounded-md">Begrepp</span>
          <span id="score-counter" class="text-xs font-medium text-slate-400">Poäng: <strong id="score" class="text-slate-200">0</strong></span>
        </div>

        <h2 id="question-text" class="text-xl sm:text-2xl font-bold text-white mb-6 leading-relaxed">
          Frågan laddas...
        </h2>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3 mb-6"></div>

        <!-- Explanation Card -->
        <div id="explanation-box" class="hidden rounded-2xl p-4 sm:p-5 border transition-all duration-200 mb-6">
          <div class="flex items-start gap-3">
            <span id="explanation-icon" class="text-xl leading-none mt-0.5">💡</span>
            <div>
              <p id="explanation-title" class="font-bold text-sm mb-1"></p>
              <p id="explanation-text" class="text-sm leading-relaxed text-slate-300"></p>
            </div>
          </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn" class="hidden w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25 active:scale-[0.99] flex items-center justify-center gap-2">
          <span>Nästa fråga</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="hidden text-center py-4">
        <div id="result-badge" class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-4xl mb-6">
          🏆
        </div>
        <h2 class="text-3xl font-extrabold text-white mb-2">Quizet är klart!</h2>
        <p class="text-slate-400 mb-6 text-sm">Bra jobbat med genomgången av hela Lektion 1!</p>

        <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-score">0</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Antal rätt</span>
          </div>
          <div class="bg-slate-850 p-4 rounded-2xl border border-slate-800">
            <span class="block text-2xl font-black text-cyan-400" id="final-percentage">0%</span>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Träffsäkerhet</span>
          </div>
        </div>

        <p id="grade-comment" class="text-base text-slate-200 font-semibold mb-8 max-w-md mx-auto"></p>

        <button id="restart-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/25">
          Starta om quizet
        </button>
      </div>

    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900">
    JENSEN education • Programmering 1 • Kursmaterial & Quiz
  </footer>

  <script>
    const quizData = [
      {
        category: "Grundbegrepp",
        question: "Vad är ett programmeringsspråk i grunden?",
        options: [
          "Ett operativsystem som styr hårdvarans interna fläktar",
          "Ett språk som en människa använder för att skapa instruktioner och datorprogram",
          "En fysisk komponent i datorns moderkort",
          "Ett programpaket som enbart hanterar nätverkstrafik"
        ],
        answer: 1,
        explanation: "Ett programmeringsspråk används av människor för att ge strukturerade instruktioner till en dator."
      },
      {
        category: "Dataenheter",
        question: "Hur många bitar (b) ingår det i 1 Byte (B)?",
        options: [
          "4 bitar",
          "8 bitar",
          "16 bitar",
          "1 024 bitar"
        ],
        answer: 1,
        explanation: "1 Byte består alltid av exakt 8 bitar. En bit är det minsta värdet (0 eller 1)."
      },
      {
        category: "Dataenheter",
        question: "Hur många Kilobytes (KB) motsvarar 1 Megabyte (MB)?",
        options: [
          "100 KB",
          "1 000 KB",
          "1 024 KB",
          "1 048 576 KB"
        ],
        answer: 2,
        explanation: "I binära databeräkningar är 1 MB = 1 024 KB (och 1 GB = 1 024 MB)."
      },
      {
        category: "Maskinkod",
        question: "Vad kallas datorns eget grundspråk som datorns hårdvara (CPU) kan förstå och exekvera direkt?",
        options: [
          "Python-skript",
          "Källkod i C++",
          "Maskinkod (bestående av ettor och nollor)",
          "Assembler mnemonics"
        ],
        answer: 2,
        explanation: "En dator kan i grunden endast förstå och köra maskinkod bestående av binära sekvenser (nollor och ettor)."
      },
      {
        category: "Assemblerspråk",
        question: "Vad kallas de korta textorden som används i assemblerspråk (som LOAD A, ADD B, MOV C)?",
        options: [
          "Operativsystemskärnor",
          "Mnemoniska symboler",
          "Standardmoduler",
          "Kompileringsklasser"
        ],
        answer: 1,
        explanation: "Assembler använder mnemoniska symboler för att ersätta svårlästa binära sifferkoder med textkommandon som LOAD, ADD och MOV."
      },
      {
        category: "Assemblerspråk",
        question: "Hur körs källkod skriven i ett assembleringsspråk?",
        options: [
          "Den tolkas direkt av bildskärmens drivrutin",
          "Den översätts till maskinkod av ett speciellt översättningsprogram som kallas assemblator (assembler)",
          "Den körs utan översättning direkt i CPU:n",
          "Den konverteras till ett Word-dokument"
        ],
        answer: 1,
        explanation: "Ordningen är: Assembleringsspråk ➔ Assemblator (assembler) ➔ Maskinkod."
      },
      {
        category: "Datorhistoria",
        question: "Hur programmerades den tidiga datorn ENIAC (1946) innan assembleringsspråk fanns?",
        options: [
          "Med enkla textfiler via diskett",
          "Manuellt genom att ställa in ett antal knappar, strömbrytare och kablar för hand",
          "Med röststyrda kommandon",
          "Genom förskrivna Python-bibliotek"
        ],
        answer: 1,
        explanation: "ENIAC (som tog upp cirka 130 kvm) programmerades manuellt med switchar och sladdar innan assemblerspråk utvecklades."
      },
      {
        category: "Högnivåspråk",
        question: "Vad kännetecknar ett högnivåspråk (såsom Python, Java eller C#)?",
        options: [
          "Det skrivs i en sorts 'halvengelska' som är mer anpassat till människors sätt att tänka",
          "Det består enbart av kretskortslödningar",
          "Det kan köras direkt i hårdvaran utan någon översättare",
          "Det kan enbart användas för spelgrafik"
        ],
        answer: 0,
        explanation: "Högnivåspråk liknar mänskligt språk (ofta engelska) och gör koden mycket lättare för människor att läsa och underhålla."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Vad gör en kompilator (Compiler)?",
        options: [
          "Den läser och kör koden rad för rad under tiden programmet är igång",
          "Den tar hela källkoden och översätter den i förväg till en fristående körbar fil (t.ex. .exe)",
          "Den kontrollerar endast stavningen i kommentarer",
          "Den formaterar bildskärmsupplösningen"
        ],
        answer: 1,
        explanation: "Kompilatorn analyserar hela projektet i förväg och skapar en färdig maskinkodsfil (.exe) innan körning."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Hur fungerar en interpretator (Interpreter)?",
        options: [
          "Den fungerar som en tolk som läser och översätter koden rad för rad i minnet under tiden den körs",
          "Den bygger alltid en fristående .exe-fil innan start",
          "Den kontrollerar hela projektet innan en enda rad får köras",
          "Den används enbart vid hårdvarutillverkning"
        ],
        answer: 0,
        explanation: "Interpretatorn översätter kontinuerligt i realtid rad för rad, utan att spara en färdig .exe-fil."
      },
      {
        category: "Kompilator vs Interpretator",
        question: "Vad händer om en interpretator stöter på ett fel längre ner i källkoden?",
        options: [
          "Programmet vägrar starta alls",
          "Programmet startar och kör alla rader fram till felet och stannar tvärt där",
          "Felet rättas automatiskt i tysthet",
          "Datorn startar om"
        ],
        answer: 1,
        explanation: "Eftersom interpretatorn tolkar i stunden kör den allt felfritt fram till den rad där felet uppstår, varpå den avbryter."
      },
      {
        category: "Felsökning",
        question: "Vad innebär termen 'Debugging' (avlusning)?",
        options: [
          "Att installera ett nytt antivirusprogram",
          "Processen att hitta, analysera och åtgärda fel och buggar i ett program",
          "Att komprimera en fil till zip-format",
          "Att översätta kod till ett annat högnivåspråk"
        ],
        answer: 1,
        explanation: "Debugging är den metodiska processen att lokalisera och fixa felaktigheter (buggar) i koden."
      },
      {
        category: "Python fakta",
        question: "Vem lanserade programspråket Python år 1991, och vad har filerna för filändelse?",
        options: [
          "Dennis Ritchie (.c)",
          "Guido van Rossum (.py)",
          "Bjarne Stroustrup (.cpp)",
          "James Gosling (.java)"
        ],
        answer: 1,
        explanation: "Python lanserades av Guido van Rossum 1991 och sparade filer har alltid ändelsen .py."
      },
      {
        category: "Kursbok & Resurser",
        question: "Vilken lärobok används i kursen enligt lektionsmaterialet?",
        options: [
          "C++ Direkt av Jan Skansholm",
          "Python från början av Jan Skansholm",
          "Automate the Boring Stuff with Python av Al Sweigart",
          "Lär dig Linux på 3 veckor"
        ],
        answer: 1,
        explanation: "Kursboken är 'Python från början' författad av Jan Skansholm (ISBN 9789144134932)."
      },
      {
        category: "Installation & System",
        question: "På vilka operativsystem är chansen stor att Python redan finns förinstallerat?",
        options: [
          "Windows XP och MS-DOS",
          "Mac och Linux",
          "PlayStation 5",
          "iOS"
        ],
        answer: 1,
        explanation: "På Mac- och Linux-datorer är Python mycket ofta förinstallerat direkt från start i operativsystemet."
      },
      {
        category: "Webbverktyg",
        question: "Vilken gratissida nämns i presentationen för att köra Python online med stöd för över 60 språk?",
        options: [
          "OneCompiler (www.onecompiler.com)",
          "Notepad++ Online",
          "PyCharm Cloud",
          "Sublime Web"
        ],
        answer: 0,
        explanation: "OneCompiler stödjer över 60 språk och databaser och låter användaren skriva, köra och dela kod direkt."
      },
      {
        category: "Officiell nedladdning",
        question: "Vad innehåller standardpaketet som man laddar ner från www.python.org?",
        options: [
          "Endast en textfil med instruktioner",
          "Både själva Python-interpretatorn och Pythons standardbibliotek med moduler",
          "Ett komplett antivirusprogram",
          "Enbart Visual Studio Code"
        ],
        answer: 1,
        explanation: "Distributionen från python.org innehåller själva motorn (interpretatorn) plus alla inbyggda moduler i standardbiblioteket."
      },
      {
        category: "VS Code Setup",
        question: "Vad behöver du göra inuti VS Code efter installation för att kunna koda Python smidigt?",
        options: [
          "Köpa en betallicens via Microsoft Store",
          "Installera Python-tillägget (Python Extension) via tilläggsmenyn",
          "Kompilera om editorns källkod",
          "Stänga av brandväggen"
        ],
        answer: 1,
        explanation: "Man öppnar extensions-fliken till vänster i VS Code, söker på 'Python' och klickar på Installera."
      },
      {
        category: "VS Code Kortkommando",
        question: "Vilket snabbkommando öppnar kommandopaletten (Command Palette) i VS Code?",
        options: [
          "Ctrl + Shift + P",
          "Ctrl + Alt + Del",
          "Ctrl + Z",
          "Alt + F4"
        ],
        answer: 0,
        explanation: "Ctrl + Shift + P (eller F1) öppnar kommandopaletten där man når alla VS Code-kommandon."
      },
      {
        category: "VS Code Kortkommando",
        question: "Vilket kortkommando öppnar filsnabbsökaren (Quick Open) för att snabbt hitta filer i VS Code?",
        options: [
          "Ctrl + P",
          "Ctrl + Shift + S",
          "Ctrl + Tab",
          "Alt + P"
        ],
        answer: 0,
        explanation: "Ctrl + P öppnar snabbsökaren för filer."
      },
      {
        category: "VS Code Kortkommando",
        question: "Hur flyttar du en markerad kodrad uppåt eller nedåt utan att klippa och klistra?",
        options: [
          "Ctrl + Shift + Up/Down",
          "Alt + Arrow Up / Arrow Down",
          "Ctrl + C följt av Ctrl + V",
          "Tab + Mellanslag"
        ],
        answer: 1,
        explanation: "Alt + Pil upp/ner flyttar raden dit markören pekar direkt uppåt eller nedåt i filen."
      },
      {
        category: "VS Code Kortkommando",
        question: "Vilket snabbkommando startar autokomplettering (IntelliSense/kodförslag) i VS Code?",
        options: [
          "Ctrl + Space",
          "Shift + Enter",
          "Alt + K",
          "F5"
        ],
        answer: 0,
        explanation: "Ctrl + Space öppnar menyn med automatiska förslag och kompletteringar för kodord."
      },
      {
        category: "VS Code Kortkommando",
        question: "Hur sätter du ut multipla markörer för att redigera på flera rader samtidigt i VS Code?",
        options: [
          "Dubbelklicka med mellanslag",
          "Alt + Klick (eller Option + Click på Mac)",
          "Hålla inne Shift + Delete",
          "Högerklicka fem gånger"
        ],
        answer: 1,
        explanation: "Genom att hålla inne Alt och klicka på flera ställen får du multipla markörer och kan skriva samtidigt på flera rader."
      },
      {
        category: "VS Code Kortkommando",
        question: "Vilket kortkommando öppnar snabbfix-menyn (Quick Fix) för att snabbt åtgärda varningar eller fel i koden?",
        options: [
          "Ctrl + . (punkt)",
          "Ctrl + Shift + F12",
          "Alt + Backspace",
          "Ctrl + End"
        ],
        answer: 0,
        explanation: "Ctrl + . (punkt) öppnar snabbfix-menyn för att rätta fel eller importera moduler som saknas."
      },
      {
        category: "VS Code Kortkommando",
        question: "Vilken tangent trycker du på för att gå direkt till definitionen av en markerad variabel eller funktion?",
        options: [
          "F12",
          "F5",
          "F1",
          "Esc"
        ],
        answer: 0,
        explanation: "F12 hoppar direkt till den plats där funktionen eller variabeln skapades/definierades."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    // DOM Elements
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationTitle = document.getElementById("explanation-title");
    const explanationText = document.getElementById("explanation-text");
    const explanationIcon = document.getElementById("explanation-icon");
    const nextBtn = document.getElementById("next-btn");
    const currentIndexEl = document.getElementById("current-index");
    const totalCountEl = document.getElementById("total-count");
    const progressBar = document.getElementById("progress");
    const scoreEl = document.getElementById("score");
    const categoryEl = document.getElementById("question-category");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const finalScore = document.getElementById("final-score");
    const finalPercentage = document.getElementById("final-percentage");
    const gradeComment = document.getElementById("grade-comment");
    const restartBtn = document.getElementById("restart-btn");

    function initQuiz() {
      totalCountEl.textContent = quizData.length;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const data = quizData[currentQuestion];

      currentIndexEl.textContent = currentQuestion + 1;
      categoryEl.textContent = data.category;
      questionText.textContent = data.question;
      explanationBox.classList.add("hidden");
      nextBtn.classList.add("hidden");

      const progressPercent = ((currentQuestion) / quizData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      optionsContainer.innerHTML = "";

      data.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-850 hover:border-slate-600 hover:bg-slate-800 transition-all duration-150 flex items-center justify-between group";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-semibold text-slate-300 group-hover:border-cyan-500/50">
              ${String.fromCharCode(65 + idx)}
            </span>
            <span class="text-sm sm:text-base font-medium text-slate-200">${opt}</span>
          </div>
        `;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (answered) return;
      answered = true;

      const data = quizData[currentQuestion];
      const buttons = optionsContainer.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);

      if (selectedIndex === data.answer) {
        score++;
        scoreEl.textContent = score;
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-emerald-500", "bg-emerald-950/40", "text-emerald-200");

        explanationBox.className = "rounded-2xl p-5 border border-emerald-800/60 bg-emerald-950/20 mb-6";
        explanationIcon.textContent = "✅";
        explanationTitle.className = "font-bold text-sm text-emerald-400 mb-1";
        explanationTitle.textContent = "Helt rätt!";
      } else {
        selectedBtn.classList.remove("border-slate-800", "bg-slate-850", "hover:border-slate-600");
        selectedBtn.classList.add("border-rose-500", "bg-rose-950/40", "text-rose-200");

        const correctBtn = buttons[data.answer];
        correctBtn.classList.remove("border-slate-800", "bg-slate-850");
        correctBtn.classList.add("border-emerald-500/80", "bg-emerald-950/20", "text-emerald-300");

        explanationBox.className = "rounded-2xl p-5 border border-rose-800/60 bg-rose-950/20 mb-6";
        explanationIcon.textContent = "❌";
        explanationTitle.className = "font-bold text-sm text-rose-400 mb-1";
        explanationTitle.textContent = "Inte riktigt.";
      }

      explanationText.textContent = data.explanation;
      explanationBox.classList.remove("hidden");
      nextBtn.classList.remove("hidden");

      if (currentQuestion === quizData.length - 1) {
        nextBtn.querySelector("span").textContent = "Se slutresultat";
      }
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        showQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      progressBar.style.width = "100%";

      finalScore.textContent = `${score} / ${quizData.length}`;
      const pct = Math.round((score / quizData.length) * 100);
      finalPercentage.textContent = `${pct}%`;

      if (pct >= 90) {
        gradeComment.textContent = "Toppbetyg! Du kan lektion 1 utan och innan, från teori till VS Code-kommandon.";
      } else if (pct >= 70) {
        gradeComment.textContent = "Mycket bra jobbat! Du har koll på det allra mesta inför nästa lektion.";
      } else if (pct >= 50) {
        gradeComment.textContent = "Godkänt! Repetera gärna kortkommandona och minnesenheterna en gång till.";
      } else {
        gradeComment.textContent = "Kika igenom presentationsbilderna en gång till och gör ett nytt försök!";
      }
    }

    restartBtn.onclick = () => {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = "0";
      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      nextBtn.querySelector("span").textContent = "Nästa fråga";
      showQuestion();
    };

    initQuiz();
  </script>
</body>
</html>
